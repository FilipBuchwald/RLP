# Nazwa musi zgadzać się z Workerem podłączonym do GitHuba w panelu Cloudflare.
name = "rlp"
main = "./worker/index.ts"
compatibility_date = "2026-10-01"

# Frontend (dist z Vite) serwuje Cloudflare jako statyczne pliki.
# Worker uruchamia się tylko dla /api/*; reszta adresów → index.html (SPA).
[assets]
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "padel-liga"
database_id = "9ac72ac0-df85-417a-8d35-24b722da271a"
migrations_dir = "migrations"

# Dostęp do zapisów (README, sekcja „Dostęp”):
# - teraz: wspólny kod grupy w sekrecie EDIT_CODE (`wrangler secret put EDIT_CODE`),
# - z własną domeną: Cloudflare Access — wpisz poniżej domenę zespołu i AUD
#   (wtedy Access ma pierwszeństwo, np. ACCESS_TEAM_DOMAIN = "patient-fire-adf3.cloudflareaccess.com").
# Bez żadnej konfiguracji API pozwala tylko na odczyt (zapisy → 401).
[vars]
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""

[observability]
enabled = true
